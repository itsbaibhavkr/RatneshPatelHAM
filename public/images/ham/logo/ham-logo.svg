<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="hamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B5121B"/>
      <stop offset="100%" stop-color="#8F0D14"/>
    </linearGradient>
  </defs>
  <!-- Background Shield / Emblem -->
  <rect width="240" height="240" rx="36" fill="url(#hamGrad)"/>
  <rect x="8" y="8" width="224" height="224" rx="28" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- HAM Monogram -->
  <text x="120" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">HAM</text>
  
  <!-- Sub-label Secular -->
  <rect x="40" y="135" width="160" height="32" rx="16" fill="#FFFFFF"/>
  <text x="120" y="157" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#B5121B" text-anchor="middle" letter-spacing="2">SECULAR</text>
  
  <!-- State Marker -->
  <text x="120" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle" opacity="0.9" letter-spacing="1">BIHAR</text>
</svg>
